# Future deployment only. This file belongs in /etc/nginx/sites-available/mailru-mcp.conf.
# The existing stream listener owns public :443; HTTPS HTTP vhosts use :8443.
limit_req_zone $binary_remote_addr zone=mailru_requests:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=mailru_connections:1m;

server {
    listen 127.0.0.1:8443 ssl;
    server_name mailru-77-238-249-144.sslip.io;
    ssl_certificate /etc/letsencrypt/live/mailru-77-238-249-144.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailru-77-238-249-144.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # Confirmation URLs and OAuth codes must not appear in request error logs.
    error_log /dev/null crit;
    client_max_body_size 12m;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/(icon\.png|setup/[A-Za-z0-9_-]+|mcp|health|authorize|cancel|register|token|revoke|confirm/[A-Za-z0-9_-]+|\.well-known/(oauth-authorization-server|oauth-protected-resource(/mcp)?|openid-configuration))$ {
        limit_req zone=mailru_requests burst=12 nodelay;
        limit_req_status 429;
        limit_conn mailru_connections 8;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location ~ ^/(login\.css|login\.js|login-icon\.png|roboto\.ttf)$ {
        root /opt/mailru-mcp/mailru_mcp;
        try_files $uri =404;
        types { text/css css; application/javascript js; image/png png; font/ttf ttf; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { return 404; }
}
