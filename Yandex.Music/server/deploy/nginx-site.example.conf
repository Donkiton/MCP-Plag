# Example for a dedicated host; replace the domain and certificate paths.
server {
    listen 443 ssl;
    server_name music.example.com;
    ssl_certificate /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    client_max_body_size 64k;

    location ~ ^/(direct/mcp/?|direct/logo[.]png|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource(/direct/mcp)?|authorize|token|register|revoke|owner/(login|action))$ {
        proxy_pass http://127.0.0.1:18767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
