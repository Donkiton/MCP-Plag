<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MCP-Plag — Mail.ru and Yandex Music for ChatGPT</title>
  <desc id="desc">The repository includes ChatGPT plugin packages and MCP server source code for Mail.ru and Yandex Music. ChatGPT connects to each service through MCP.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#78877D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#F7F6F2"/>
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="124" fill="#17231E" font-size="88" font-weight="650" letter-spacing="-4">MCP-Plag</text>
    <text x="1138" y="110" fill="#0A7A61" font-size="28" text-anchor="end" font-weight="600">{ / }</text>
    <path d="M60 160H1140" stroke="#D3D8D0" stroke-width="1.5"/>
  </g>
  <g id="connections" fill="none" stroke="#78877D" stroke-width="2" marker-end="url(#arrow)">
    <path d="M281 283H407"/>
    <path d="M578 283H670Q686 283 686 267V241Q686 225 702 225H757"/>
    <path d="M578 283H670Q686 283 686 299V325Q686 341 702 341H757"/>
  </g>
