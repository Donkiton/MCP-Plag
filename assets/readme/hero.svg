  </g>
  <g id="mcp" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="415" y="239" width="156" height="88" rx="14" fill="#0A7A61"/>
    <text x="493" y="299" fill="#FFFFFF" font-size="44" font-weight="650" text-anchor="middle">MCP</text>
  </g>
  <g id="mail" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="777" y="205" width="43" height="32" rx="5" fill="none" stroke="#0A7A61" stroke-width="3"/>
    <path d="m780 209 18 14 19-14" fill="none" stroke="#0A7A61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
